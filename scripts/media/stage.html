<div class="top"><img class="logo" src="/build/icon.svg"><span class="brand">声桥 SpeakBridge</span><i class="divider"></i><h1 id="chapter">上手指南</h1><span class="badge">0.7.11 · 虚构资料 / 模拟服务</span></div>
<div class="window"><iframe id="app" src="/?tutorial=1" allow="microphone"></iframe><div class="editor" id="editor"><span class="example">输入流程示意 · 模拟目标编辑器与识别结果</span><h2>团队对话</h2><div class="conversation">请把下次讨论的时间写在这里。</div><textarea id="target" placeholder="先点击这里，再使用听写快捷键…"></textarea><button class="send" tabindex="-1">发送</button><div class="unsubmitted">文字已填入 · 尚未发送，请先检查</div></div><div class="keys"><span>⌘ / Ctrl</span><span>Shift</span><span>D</span></div><div class="hud"><iframe id="hud" src="/?tutorial=1#dictation"></iframe></div></div>
<aside class="rail"><div class="eyebrow" id="number">QUICK START</div><h2 class="step" id="step">开始使用</h2><p class="details" id="details"></p><div class="note" id="note"></div></aside>
<div class="caption" id="caption">从配置到使用，一步步完成。</div><div class="track"><div class="progress" id="progress"></div></div><div class="cursor" id="cursor"></div><div class="highlight" id="highlight"></div>
<div class="title-slide" id="title"><div class="title-copy"><span class="pill">声桥 SpeakBridge · 快速上手</span><h2>把声音<br>变成可用的文字</h2><p>配置引擎 · 会议纪要<br>跨应用听写 · 历史管理</p><small>当前界面的操作演示 · 中文字幕 / 无配音<br>使用虚构资料，模拟识别、模型和输入结果</small></div><img class="poster" src="/docs/media/speakbridge-overview.png"></div>
<script>
window.setScene=({chapter,number,title,detail,note,caption,progress})=>{document.querySelector('#title').style.display='none';for(const [id,value]of Object.entries({chapter,number,step:title,details:detail,note,caption})){document.getElementById(id).textContent=value||''}document.getElementById('progress').style.width=progress+'%';document.getElementById('highlight').style.display='none'};
window.point=({x,y,width=0,height=0,click=false})=>{const c=document.querySelector('#cursor');c.style.opacity='1';c.style.left=x+'px';c.style.top=y+'px';c.classList.toggle('click',click);const h=document.querySelector('#highlight');h.style.display=width?'block':'none';Object.assign(h.style,{left:(x-width/2-5)+'px',top:(y-height/2-5)+'px',width:(width+10)+'px',height:(height+10)+'px'})};
</script></html>
